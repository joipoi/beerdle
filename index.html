<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beer Wordle</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game">
    <header>
      <h1>Beerdle</h1>
      <p>Gissa ölen på 6 försök</p>
      <p class="wrong">Grått = fel</p>
      <p class="close">Gult = nära</p>
      <p class="correct">Grönt = korrekt</p>
    </header>

    <section class="game-info">
      <span id="guesses-left">6 gissningar kvar</span>
      <button id="new-game" type="button">Nytt Spel</button>
    </section>

    <form id="guess-form" autocomplete="off">
      <label for="beer-input">Din gissning</label>
      <div class="input-row">
        <div class="beer-search">
          <input id="beer-input" placeholder="Search for a beer..." required aria-controls="beer-suggestions" aria-expanded="false">
          <div id="beer-suggestions" class="suggestions hidden" role="listbox"></div>
        </div>
        <button type="submit">Gissa</button>
      </div>
    </form>

    <div id="message" class="message" aria-live="polite"></div>

    <section class="results">
      <div class="result-header">
        <span>Öl</span>
        <span>Alkohol %</span>
        <span>Kategori</span>
        <span>Stil</span>
        <span>Pris</span>
        <span>Land</span>
      </div>
      <div id="guesses"></div>
    </section>

    <section id="answer" class="answer hidden"></section>
  </main>

  <script src="data.js"></script>
  <script src="game.js"></script>
</body>
</html>
